[package]
name = "reconcile-vault"
version = "0.1.0"
edition = "2021"
description = "Reference reconciliation tool for GistVault — cross-checks events against on-chain state"

[[bin]]
name = "reconcile-vault"
path = "src/main.rs"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
hex = "0.4"
